name: Daily Telegram News & Stock Bot

on:
  schedule:
    # 한국 시간 기준 오전 8시 30분 (UTC 기준 전날 23시 30분)
    - cron: '30 23 * * *'
  workflow_dispatch: # 수동 테스트 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필요 라이브러리 설치
        run: |
          pip install pyTelegramBotAPI yfinance feedparser

      - name: 봇 실행
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
